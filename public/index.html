<!doctype html>
<html lang="en">
<head>
    <link rel="apple-touch-icon" href="./img/icons/apple-touch-icon.png">
    <link rel="icon" href="./img/icons/favicon.ico">
    <link rel="manifest" href="app.webmanifest" />
    <link rel="stylesheet" href="./css/app.css">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#0AA">
    <meta name="theme-color" media="(prefers-color-scheme: dark)"  content="#0AA">
    <!-- ... -->
</head>
<body>
    <header>
        <nav>H</nav>
    </header>
    <h1>Title</h1>

    <div class="display-tests">
        <div class="display-if-installed">
            The app is installed.
        </div>
        <div class="display-if-installed-standalone">
            The app is installed and runs in standalone mode.
        </div>
        <div class="display-if-in-browser">
            The app runs in browser (show install instructions).
        </div>
    </div>

    <div class="accent-color">
        <ul>
            <li>Item</li>
            <li>Item</li>
        </ul>
    </div>

    <!-- Test: response generated by service worker. -->
    <script async src="./js/worker-generated-script.js"></script>
    <script>
        // Check if service worker is supported.
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("./service-worker.js").then(
                (registration) => {
                    console.log("Service worker registration successful:", registration);
                },
                (error) => {
                    console.error(`Service worker registration failed: ${error}`);
                },
            );
        } else {
            console.error("Service workers are not supported.");
        }
    </script>
</body>
</html>
